[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-localization-engineering-toolkit"
version = "0.2.0rc1"
description = "File safety, BGI text slots, deployment, packaging, reviewed translation, and auditable compiler adapters"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
localize = "localization_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
